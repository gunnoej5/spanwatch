<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>spanwatch</title>
<style>
:root{
  --ink:#07090b; --panel:#0d1114; --panel2:#11171b; --line:#1d262c; --line2:#2a363e;
  --text:#c9d4d8; --dim:#6f7f87; --faint:#43525a;
  --sig:#5cf2a6; --sig-d:#1d4d38; --amber:#ffb547; --amber-d:#4a3613;
  --red:#ff5d5d; --red-d:#4a1717; --blue:#6cb6ff; --violet:#b69cff;
  --mono:"JetBrains Mono","IBM Plex Mono","Cascadia Code",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter Tight","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:13px/1.45 var(--mono);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% -10%,rgba(92,242,166,.07),transparent 55%),linear-gradient(transparent,rgba(7,9,11,.85) 70%)}
a{color:var(--blue)}
.wrap{position:relative;display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line2);background:rgba(13,17,20,.92);backdrop-filter:blur(6px)}
.brand{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--sig);display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.brand i.on{background:var(--sig);box-shadow:0 0 12px var(--sig);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.host{color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);padding:2px 8px;border-radius:2px;color:var(--dim);font-size:11px;white-space:nowrap}
.chip.ok{color:var(--sig);border-color:var(--sig-d);background:rgba(92,242,166,.05)}
.chip.warn{color:var(--amber);border-color:var(--amber-d);background:rgba(255,181,71,.06)}
.chip.bad{color:var(--red);border-color:var(--red-d);background:rgba(255,93,93,.08);font-weight:700}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;padding:4px 9px;cursor:pointer;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.sel{color:var(--ink);background:var(--sig)}
input[type=text]{background:var(--ink);border:1px solid var(--line2);color:var(--text);font:inherit;padding:4px 8px;outline:none}
input[type=text]:focus{border-color:var(--sig-d)}
.btn{font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:5px 14px;cursor:pointer;border:1px solid var(--sig);background:var(--sig);color:var(--ink)}
.btn.stop{background:var(--red);border-color:var(--red)}
.btn.ghost{background:none;color:var(--dim);border-color:var(--line2);font-weight:400;letter-spacing:0;text-transform:none}
.btn.ghost:hover{color:var(--text);border-color:var(--dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
aside{border-right:1px solid var(--line2);background:rgba(13,17,20,.88);overflow:auto}
aside h3,.sect h3{margin:0;padding:12px 14px 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:600}
.sess{padding:9px 14px;border-left:2px solid transparent;cursor:pointer;border-bottom:1px solid var(--line)}
.sess:hover{background:var(--panel2)}
.sess.sel{border-left-color:var(--sig);background:var(--panel2)}
.sess .t{display:flex;justify-content:space-between;color:var(--text)}
.sess .m{color:var(--dim);font-size:11px}
.sess .n{color:var(--amber);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess.live .t::after{content:"● live";color:var(--sig);font-size:10px}
main{overflow:auto;padding:14px 18px 40px}
.meter{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);margin-bottom:12px}
.meter div{background:var(--panel);padding:8px 12px}
.meter b{display:block;font-size:19px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.meter span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.meter .hot b{color:var(--red)}
.bar{height:2px;background:var(--line);margin:-12px 0 12px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sig);box-shadow:0 0 8px var(--sig);transition:width .9s linear}
.tabs{display:flex;gap:0;align-items:end;border-bottom:1px solid var(--line2);margin-bottom:10px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:inherit;padding:7px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button.sel{color:var(--text);border-bottom-color:var(--sig)}
.tabs .tools{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px}
.count{color:var(--faint);font-size:11px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:-14px;background:var(--ink);text-align:left;font-weight:500;color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
th[data-sort]{cursor:pointer}
th[data-sort]:hover,th.sorted{color:var(--sig)}
td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:hover td{background:rgba(92,242,166,.035)}
td.r,th.r{text-align:right}
.ip{color:var(--text);cursor:pointer}
.ip:hover{color:var(--sig)}
.nm{display:block;color:var(--faint);font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--faint);padding:0 2px}
.p-TCP{color:var(--blue)}.p-UDP{color:var(--violet)}.p-ICMP,.p-ICMPv6{color:var(--amber)}
.svc{color:var(--dim)}
.dir{color:var(--faint);font-size:11px}
.rc-NOERROR{color:var(--sig)}.rc-NXDOMAIN{color:var(--amber)}.rc-SERVFAIL,.rc-REFUSED,.rc-NO-RESPONSE{color:var(--red)}
.ans{white-space:normal;color:var(--dim);max-width:520px;word-break:break-all}
.qn{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.sect{background:var(--panel);border:1px solid var(--line2)}
.sect h3{border-bottom:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:4px 14px;position:relative}
.hrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
.hrow .v{color:var(--dim);position:relative;z-index:1}
.hrow .fill{position:absolute;left:0;top:2px;bottom:2px;background:linear-gradient(90deg,rgba(92,242,166,.16),rgba(92,242,166,.04));border-right:1px solid rgba(92,242,166,.4)}
.sect.amber .fill{background:linear-gradient(90deg,rgba(255,181,71,.16),rgba(255,181,71,.04));border-right-color:rgba(255,181,71,.4)}
.empty{color:var(--faint);padding:40px;text-align:center}
.g{display:inline-block;border:1px solid var(--c);color:var(--c);padding:0 6px;font-size:11px;line-height:17px;border-radius:2px}
.g.conf3{background:color-mix(in srgb,var(--c) 18%,transparent)}
.g.conf1{border-style:dashed;opacity:.75}
.gsect{margin-top:12px}
.gsect h3{display:flex;align-items:center;gap:14px}
.gsect h3 .sub{letter-spacing:0;text-transform:none;color:var(--dim);font-weight:400}
.gctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.gctl .lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.gctl .lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.gctl .lg b{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px}
#graph{position:relative;background:radial-gradient(ellipse at center,rgba(92,242,166,.03),transparent 70%)}
.gsvg{display:block;user-select:none}
.gsvg line{stroke-linecap:round;opacity:.55;transition:opacity .15s}
.gsvg .nd{cursor:grab;transition:opacity .15s}
.gsvg .nd circle{stroke:var(--ink);stroke-width:1.5}
.gsvg text{fill:var(--text);font:10px var(--mono);paint-order:stroke;stroke:var(--ink);stroke-width:3px}
.gsvg text.sub{fill:var(--faint);font-size:9px}
.gsvg text.hide{display:none}
.gsvg.focus line{opacity:.06}.gsvg.focus line.hi{opacity:1}
.gsvg.focus .nd{opacity:.2}.gsvg.focus .nd.hi{opacity:1}
.gsvg.focus .nd.hi text.hide{display:inline}
.gsvg{cursor:grab;touch-action:none}.gsvg.panning{cursor:grabbing}
.gsvg.zin text.hide{display:inline}
.gsvg text.sub.org{fill:#9b8a5e}
.gsvg line{vector-effect:non-scaling-stroke}
.zbar{position:absolute;right:10px;top:10px;display:flex;align-items:center;border:1px solid var(--line2);background:rgba(13,17,20,.92)}
.zbar button{background:none;border:0;border-right:1px solid var(--line2);color:var(--dim);font:inherit;font-size:12px;padding:3px 9px;cursor:pointer}
.zbar button:hover{color:var(--sig)}
.zbar span{padding:0 8px;color:var(--faint);font-size:11px;min-width:44px;text-align:right}
.wi{background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:11px;padding:0 4px;vertical-align:baseline}
.wi:hover{color:var(--blue)}
.svc.org{color:#9b8a5e}
#wpanel{position:fixed;top:47px;right:0;bottom:0;width:400px;max-width:100vw;background:rgba(13,17,20,.97);border-left:1px solid var(--line2);z-index:8;overflow:auto;box-shadow:-20px 0 40px rgba(0,0,0,.45);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
#wpanel .wh{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel)}
#wpanel .wh b{color:var(--sig);font-weight:600}
.whead{padding:12px 14px 4px;font:600 15px var(--sans);color:var(--text)}
.wt{margin:4px 0 8px}
.wt th{position:static;background:none;border:0;padding:3px 8px 3px 14px;vertical-align:top;width:92px}
.wt td{border:0;white-space:normal;word-break:break-word;padding:3px 14px 3px 0}
.wlinks{display:flex;gap:12px;padding:6px 14px 10px}
.wlinks a{font-size:11px}
.wfoot{color:var(--faint);font-size:10px;padding:10px 14px;border-top:1px solid var(--line)}
.err{position:fixed;bottom:14px;right:14px;background:var(--red-d);border:1px solid var(--red);color:#ffd6d6;padding:8px 12px;max-width:520px;z-index:9}
.hint{color:var(--faint);font-size:11px;padding:0 14px 12px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{display:none}.meter{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><i id="led"></i>spanwatch</div>
  <div class="host" id="host"></div>
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <div class="ctl">
    <div class="seg" id="dur"></div>
    <input type="text" id="note" placeholder="note (optional)" size="18" maxlength="200">
    <button class="btn" id="go">Capture</button>
  </div>
</header>
<aside>
  <h3>Sessions</h3>
  <div id="sessions"></div>
</aside>
<main>
  <div class="meter" id="meter"></div>
  <div class="bar"><i id="prog" style="width:0"></i></div>
  <div class="tabs" id="tabs">
    <button data-t="flows" class="sel">Conversations</button>
    <button data-t="dns">DNS</button>
    <button data-t="mix">Breakdown</button>
    <div class="tools">
      <span class="count" id="count"></span>
      <input type="text" id="q" placeholder="filter: ip, port, proto, name…" size="30">
      <a class="btn ghost" id="exp1" href="#">csv</a>
      <a class="btn ghost" id="exp2" href="#" style="display:none">txt</a>
      <button class="btn ghost" id="del" title="delete session">delete</button>
    </div>
  </div>
  <div id="view"><div class="empty">no session selected — pick a duration and hit <b>Capture</b></div></div>
</main>
</div>
<div class="err" id="err" hidden></div>
<div id="wpanel" hidden>
  <div class="wh"><b id="wip"></b><span class="spacer"></span>
    <button class="btn ghost" id="wfil" title="filter the session on this IP">filter</button>
    <button class="btn ghost" id="wref" title="bypass the 7-day cache">refresh</button>
    <button class="btn ghost" id="wx" title="close (Esc)">✕</button></div>
  <div id="wbody"></div>
  <div class="wfoot">Looked up only when you ask, public IPs only: RDAP via rdap.arin.net (redirects to the owning RIR) + Team Cymru IP→ASN. Cached 7 days.</div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const DUR = [[30,"30s"],[120,"2m"],[300,"5m"],[900,"15m"],[3600,"60m"]];
const S = {dur: 120, sel: null, tab: "flows", sort: "bytes", q: "", status: null, sessions: [], timer: null,
  gm: "packets", gs: "log", pos: {}, gdata: null, drag: null, posFor: null,
  zoom: {k:1, tx:0, ty:0}, gplace: null, gW: 800, gH: 500, wip: null};
const CAT = {wireguard:"vpn",openvpn:"vpn",ipsec:"vpn","pptp-vpn":"vpn","l2tp-vpn":"vpn",gre:"vpn",
  ssh:"remote",rdp:"remote",vnc:"remote",tls:"web",quic:"web","dns-over-tls":"web",
  bittorrent:"p2p","bittorrent-dht":"p2p",p2p:"p2p",stun:"rtc",http:"plain",encrypted:"unk"};
const CATC = {vpn:"#ff5dc8",remote:"#ffb547",web:"#6cb6ff",p2p:"#ff5d5d",rtc:"#b69cff",plain:"#5cf2a6",unk:"#c9d4d8",none:"#46565e"};
const CATN = {vpn:"vpn/tunnel",remote:"ssh/remote",web:"tls/quic",p2p:"torrent/p2p",rtc:"stun/rtc",plain:"plaintext",unk:"encrypted?",none:"other"};
const KINDC = {local:"#5cf2a6",public:"#ff8a5c",cgnat:"#ffb547",multicast:"#6f7f87",loopback:"#6cb6ff",other:"#6f7f87"};
const catOf = g => CAT[String(g||"").replace(/\?$/,"")] || (g ? "unk" : "none");
const CONFN = ["","heuristic (port/entropy/behaviour)","strong hint","protocol signature"];
function isPublic(ip){
  ip = String(ip||"").toLowerCase();
  if(ip.includes(":")) return /^[23]/.test(ip) && !ip.startsWith("2001:db8");
  const p = ip.split(".").map(Number); if(p.length!==4 || p.some(isNaN)) return false;
  const [a,b,c] = p;
  return !(a===0||a===10||a===127||a>=224||(a===169&&b===254)||(a===172&&b>=16&&b<=31)||(a===192&&b===168)
    ||(a===100&&b>=64&&b<=127)||(a===192&&b===0&&c===2)||(a===198&&(b===18||b===19))||(a===198&&b===51&&c===100)||(a===203&&b===0&&c===113));
}
const wiBtn = ip => (S.status?.whois && isPublic(ip)) ? '<button class="wi" data-whois="'+esc(ip)+'" title="whois / ARIN">ⓘ</button>' : "";
async function openWhois(ip, refresh){
  S.wip = ip; $("#wpanel").hidden = false; $("#wip").textContent = ip;
  $("#wbody").innerHTML = '<div class="hint" style="padding:14px">querying registries…</div>';
  try{
    const d = await api("/api/whois?ip="+encodeURIComponent(ip)+(refresh?"&refresh=1":""), {headers:{"X-Spanwatch-Action":"1"}});
    if(S.wip !== ip) return;
    $("#wbody").innerHTML = whoisHtml(d);
    if(!d.cached && S.tab === "mix") loadView(true);   // pick up the new org label
  }catch(e){ if(S.wip === ip) $("#wbody").innerHTML = '<div class="hint" style="padding:14px;color:var(--amber)">'+esc(e.message)+'</div>'; }
}
function whoisHtml(d){
  const r = d.rdap||{}, a = d.asn||{};
  const row = (k,v) => v ? '<tr><th>'+k+'</th><td>'+v+'</td></tr>' : "";
  const ext = (href, txt) => '<a target="_blank" rel="noopener noreferrer" href="'+esc(href)+'">'+txt+'</a>';
  return '<div class="whead">'+esc(d.short||r.name||"no registry match")+'</div><table class="wt">'
    + row("org", esc(r.org))
    + row("network", esc([r.name, r.handle].filter(Boolean).join(" · ")))
    + row("range", esc(r.range))
    + row("cidr", esc((r.cidrs||[]).join(", ")))
    + row("asn", a.asn ? 'AS'+a.asn+' <span class="svc">'+esc(a.as_name)+'</span>' : "")
    + row("bgp prefix", esc(a.bgp_prefix))
    + row("country", esc(r.country||a.cc))
    + row("registry", esc(r.rir||a.registry))
    + row("type", esc(r.type))
    + row("parent", esc(r.parent))
    + row("abuse", r.abuse ? '<a href="mailto:'+esc(r.abuse)+'">'+esc(r.abuse)+'</a>' : "")
    + row("registered", esc(r.registered||a.allocated))
    + row("updated", esc(r.updated))
    + '</table><div class="wlinks">'
    + (r.rdap_url ? ext(r.rdap_url, "rdap json") : "")
    + ext("https://search.arin.net/rdap/?query="+encodeURIComponent(d.ip), "arin search")
    + (a.asn ? ext("https://bgp.he.net/AS"+a.asn, "bgp.he.net") : "")
    + '</div>'
    + ((d.errors||[]).length ? '<div class="hint" style="color:var(--amber)">'+esc(d.errors.join("; "))+'</div>' : "")
    + '<div class="hint">'+(d.cached ? "cached · looked up "+dfmt(d.ts) : "fresh lookup")+'</div>';
}
$("#wx").onclick = () => { $("#wpanel").hidden = true; S.wip = null; };
$("#wref").onclick = () => S.wip && openWhois(S.wip, true);
$("#wfil").onclick = () => { if(!S.wip) return; $("#q").value = S.wip; S.q = S.wip; loadView(true); };
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#wpanel").hidden) $("#wx").onclick(); });

function guessCell(f){
  if(!f.guess) return '<span class="dir">—</span>';
  const lab = f.guess + (f.conf<=1 ? "?" : "");
  return '<span class="g conf'+f.conf+'" style="--c:'+CATC[catOf(f.guess)]+'" title="'+esc(CONFN[f.conf]+(f.detail?" — "+f.detail:""))+'">'+esc(lab)+'</span>'
    + (f.detail && f.conf>=2 ? '<span class="nm" title="'+esc(f.detail)+'">'+esc(f.detail)+'</span>' : "");
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n ?? 0).toLocaleString();
function bytes(n){n=n||0;const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(n<10?2:1):n)+" "+u[i]}
function dur(s){s=Math.max(0,Math.round(s||0));const m=Math.floor(s/60),x=s%60;return m?m+"m"+String(x).padStart(2,"0")+"s":x+"s"}
const tfmt = t => t ? new Date(t*1000).toLocaleTimeString([], {hour12:false}) : "";
const dfmt = t => t ? new Date(t*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}) : "";

function oops(msg){const e=$("#err");e.textContent=msg;e.hidden=false;clearTimeout(oops.t);oops.t=setTimeout(()=>e.hidden=true,6000)}
async function api(path, opt={}){
  const r = await fetch(path, opt);
  const j = await r.json().catch(()=>({error: r.statusText}));
  if(!r.ok) throw new Error(j.error || r.status);
  return j;
}
const post = (p, body) => api(p, {method:"POST", headers:{"Content-Type":"application/json","X-Spanwatch-Action":"1"}, body: JSON.stringify(body||{})});

// ---------------------------------------------------------------- header
function renderDur(){
  $("#dur").innerHTML = DUR.map(([v,l]) => '<button data-v="'+v+'" class="'+(v===S.dur?"sel":"")+'">'+l+'</button>').join("");
}
$("#dur").onclick = e => { const v = +e.target.dataset.v; if(v){S.dur=v;renderDur()} };

function renderStatus(){
  const st = S.status; if(!st) return;
  const f = st.iface, cur = st.current, running = cur && cur.status === "running";
  $("#host").textContent = st.host;
  $("#led").className = running ? "on" : "";
  const c = [];
  if(!f.present){ c.push('<span class="chip bad">'+esc(f.iface)+' absent</span>'); }
  else {
    c.push('<span class="chip '+(f.carrier?"ok":"warn")+'">'+esc(f.iface)+' '+(f.carrier?"link":"no-link")+(f.speed_mbps?" "+(f.speed_mbps>=1000?(f.speed_mbps/1000)+"G":f.speed_mbps+"M"):"")+'</span>');
    c.push(st.receive_only ? '<span class="chip ok" title="no IPv4/IPv6 addresses on the sniff port">no IP ✓</span>'
                           : '<span class="chip bad" title="'+esc((f.addresses||[]).join(", "))+'">HAS IP: '+esc((f.addresses||["?"]).join(", "))+'</span>');
    c.push('<span class="chip '+(f.promisc?"ok":"warn")+'">'+(f.promisc?"promisc":"not promisc")+'</span>');
    c.push('<span class="chip '+(f.tx_packets===0?"ok":"warn")+'" title="packets transmitted by the sniff port since it came up">tx '+num(f.tx_packets)+'</span>');
    if(f.ipv6_disabled===false) c.push('<span class="chip warn">ipv6 on</span>');
  }
  $("#chips").innerHTML = c.join("");
  const go = $("#go");
  go.textContent = running ? "Stop" : "Capture";
  go.className = "btn" + (running ? " stop" : "");
  go.disabled = !running && (!f.present || !st.receive_only);
}
$("#go").onclick = async () => {

    if(running){ await post("/api/stop"); }
    else { const s = await post("/api/start", {duration: S.dur, note: $("#note").value}); S.sel = s.id; $("#note").value=""; }

};

// ---------------------------------------------------------------- meter
function renderMeter(s){
  if(!s){ $("#meter").innerHTML=""; $("#prog").style.width="0"; return; }
  const el = Math.max(s.elapsed, 0.001);
  const live = s.status === "running";
  const cells = [
    ["packets", num(s.packets)], ["volume", bytes(s.bytes)],
    ["avg rate", ((s.bytes*8/el)/1e6).toFixed(2)+" Mb/s"], ["pps", num(Math.round(s.packets/el))],
    ["conversations", num(s.flow_count)], ["dns", num(s.dns_count)],
    ["kernel drops", num(s.kernel_drops), s.kernel_drops>0],
  ];
  $("#meter").innerHTML = cells.map(([k,v,hot]) => '<div class="'+(hot?"hot":"")+'"><b>'+v+'</b><span>'+k+'</span></div>').join("");
  const pct = s.duration ? Math.min(100, 100*s.elapsed/s.duration) : 100;
  $("#prog").style.width = (live ? pct : 100) + "%";
  $("#prog").style.background = live ? "" : "var(--faint)";
  $("#prog").style.boxShadow = live ? "" : "none";
  if(s.error) oops("session #"+s.id+": "+s.error);
}

function graphShell(){

  return '<div class="sect gsect"><h3>IP relationships <span class="sub">line width = occurrences seen, 1px (least) → 6px (most) · scroll to zoom · drag background to pan · double-click to reset · click node = filter · right-click node = whois</span></h3>'
    + '<div class="gctl">'+seg("gm",S.gm,[["packets","packets"],["conns","conversations"],["bytes","bytes"]])
    + seg("gs",S.gs,[["log","log"],["linear","linear"]])

function layout(nodes, edges, idx, W, H){
  const N = nodes.length, k = Math.sqrt(W*H/Math.max(N,1)) * 0.62, cut2 = (4*k)*(4*k);
  let fresh = 0;
  for(const n of nodes){
    const p = S.pos[n.id];
    if(p){ n.x = p.x*W; n.y = p.y*H; }
    else { fresh++; n.x = W/2 + (Math.random()-.5)*W*.7; n.y = H/2 + (Math.random()-.5)*H*.7; }
  }
  const cold = fresh > N*0.3;
  const iters = cold ? 400 : fresh ? 120 : 0;
  let t = cold ? W/6 : k*0.4;
  for(let it=0; it<iters; it++){
    for(const n of nodes){ n.dx = 0; n.dy = 0; }
    for(let i=0;i<N;i++){ const a=nodes[i];
      for(let j=i+1;j<N;j++){ const b=nodes[j];
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
        if(d2<0.01){ dx=Math.random()-.5; dy=Math.random()-.5; d2=0.5; }
        if(d2>cut2) continue;
        const d=Math.sqrt(d2), f=k*k/d;
        a.dx+=dx/d*f; a.dy+=dy/d*f; b.dx-=dx/d*f; b.dy-=dy/d*f; } }
    for(const e of edges){ const a=idx[e.a], b=idx[e.b];
      const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy)||0.1, f=d*d/k*(0.55+0.09*e.w);
      a.dx-=dx/d*f; a.dy-=dy/d*f; b.dx+=dx/d*f; b.dy+=dy/d*f; }
    for(const n of nodes){
      n.dx += (W/2-n.x)*0.22; n.dy += (H/2-n.y)*0.38;
      const d=Math.sqrt(n.dx*n.dx+n.dy*n.dy)||1, s=Math.min(d,t)/d;
      n.x=Math.max(40,Math.min(W-150,n.x+n.dx*s)); n.y=Math.max(22,Math.min(H-28,n.y+n.dy*s));
    }
    t = Math.max(t*0.985, 0.5);
  }
  for(const n of nodes) S.pos[n.id] = {x:n.x/W, y:n.y/H};
}

function zoomBy(f, px, py){
  const Z = S.zoom;
  if(px == null){ px = S.gW/2; py = S.gH/2; }
  const k2 = Math.max(0.3, Math.min(12, Z.k*f)); f = k2/Z.k;
  Z.tx = px - (px - Z.tx)*f; Z.ty = py - (py - Z.ty)*f; Z.k = k2;
  if(S.gplace) S.gplace();
}

function drawGraph(){
  const box = $("#graph"), d = S.gdata;
  if(!box || !d) return;
  S.gplace = null;
  if(!d.edges.length){ box.innerHTML = '<div class="empty">no IP pairs'+(S.q?" match":" yet")+'</div>'; return; }
  const W = Math.max(box.clientWidth, 600), H = Math.round(Math.max(440, Math.min(820, 300 + d.nodes.length*4)));
  S.gW = W; S.gH = H;
  const Z = S.zoom;
  const val = e => S.gm==="bytes" ? e.bytes : S.gm==="conns" ? e.flows : e.packets;
  const sc = S.gs==="log" ? (x => Math.log(Math.max(x,1))) : (x => x);
  const vs = d.edges.map(val), lo = sc(Math.min(...vs)), hi = sc(Math.max(...vs));
  const edges = d.edges.map(e => ({...e, w: hi>lo ? 1 + 5*(sc(val(e))-lo)/(hi-lo) : 1}));
  const nodes = d.nodes.map(n => ({...n})), idx = {}, adj = {};
  nodes.forEach(n => { idx[n.id] = n; adj[n.id] = []; });
  edges.forEach((e,i) => { adj[e.a].push(i); adj[e.b].push(i); });
  const maxB = Math.max(...nodes.map(n=>n.bytes), 1);
  nodes.forEach(n => n.r = 3 + 9*Math.sqrt(n.bytes/maxB));
  const labelled = new Set([...nodes].sort((a,b)=>b.bytes-a.bytes).slice(0,30).map(n=>n.id));
  nodes.forEach(n => { if(adj[n.id].length >= 3) labelled.add(n.id); });
  layout(nodes, edges, idx, W, H);
  const metricTxt = e => num(e.packets)+" pkts · "+bytes(e.bytes)+" · "+e.flows+" conversation"+(e.flows===1?"":"s");
  let s = '<svg class="gsvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  edges.forEach((e,i) => {
    s += '<line data-e="'+i+'" stroke="'+CATC[catOf(e.guess)]+'" stroke-width="'+e.w.toFixed(2)+'">'
      + '<title>'+esc(e.a+"  ⇄  "+e.b+"\n"+metricTxt(e)+"\n"+e.labels.join("\n"))+'</title></line>'; });
  nodes.forEach(n => {
    const show = labelled.has(n.id) ? "" : " hide", sub = n.name || n.org || "";
    s += '<g class="nd" data-n="'+esc(n.id)+'">'
      + '<circle r="'+n.r.toFixed(1)+'" fill="'+(KINDC[n.kind]||KINDC.other)+'"/>'
      + '<text class="'+show+'" x="'+(n.r+4).toFixed(1)+'" y="3">'+esc(n.id)+'</text>'
      + (sub ? '<text class="sub'+(n.name?"":" org")+show+'" x="'+(n.r+4).toFixed(1)+'" y="14">'+esc(sub.length>34?sub.slice(0,33)+"…":sub)+'</text>' : "")
      + '<title>'+esc(n.id+(n.name?"\n"+n.name:"")+(n.org?"\norg: "+n.org:"")+"\n"+n.kind+" · "+num(n.packets)+" pkts · "+bytes(n.bytes)+" · "+adj[n.id].length+" peers"+(isPublic(n.id)?"\nright-click: whois":""))+'</title></g>'; });
  box.innerHTML = s + '</svg><div class="zbar"><button data-gz="in" title="zoom in">+</button><button data-gz="out" title="zoom out">−</button><button data-gz="reset" title="reset view">fit</button><span id="zlab"></span></div>';

  const svg = box.querySelector("svg"), lines = svg.querySelectorAll("line"), gEls = {};
  svg.querySelectorAll(".nd").forEach(g => gEls[g.dataset.n] = g);
  const place = () => {
    const k = Z.k, tx = Z.tx, ty = Z.ty;
    edges.forEach((e,i) => { const a = idx[e.a], b = idx[e.b], l = lines[i];
      l.setAttribute("x1", (a.x*k+tx).toFixed(1)); l.setAttribute("y1", (a.y*k+ty).toFixed(1));
      l.setAttribute("x2", (b.x*k+tx).toFixed(1)); l.setAttribute("y2", (b.y*k+ty).toFixed(1)); });
    nodes.forEach(n => gEls[n.id].setAttribute("transform", "translate("+(n.x*k+tx).toFixed(1)+","+(n.y*k+ty).toFixed(1)+")"));
    svg.classList.toggle("zin", k >= 1.8);
    const zl = document.getElementById("zlab"); if(zl) zl.textContent = k.toFixed(1)+"×";
  };
  S.gplace = place; place();

  const focus = id => { svg.classList.add("focus");
    for(const i of adj[id]){ const e=edges[i]; lines[i].classList.add("hi"); gEls[e.a].classList.add("hi"); gEls[e.b].classList.add("hi"); }
    gEls[id].classList.add("hi"); };
  const unfocus = () => { svg.classList.remove("focus"); svg.querySelectorAll(".hi").forEach(x=>x.classList.remove("hi")); };
  svg.addEventListener("pointerover", e => { const g=e.target.closest(".nd"); if(g && !S.drag) focus(g.dataset.n); });
  svg.addEventListener("pointerout", e => { const g=e.target.closest(".nd"); if(g && !S.drag && !g.contains(e.relatedTarget)) unfocus(); });
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), dy = e.deltaY*(e.deltaMode===1 ? 33 : e.deltaMode===2 ? 400 : 1);
    zoomBy(Math.exp(-dy*0.0015), e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});
  svg.addEventListener("dblclick", e => { if(!e.target.closest(".nd")){ Object.assign(Z, {k:1,tx:0,ty:0}); place(); } });
  svg.addEventListener("contextmenu", e => { const g = e.target.closest(".nd"); if(!g) return;
    e.preventDefault();
    if(isPublic(g.dataset.n) && S.status?.whois) openWhois(g.dataset.n); else oops(g.dataset.n+": private/reserved address, no public registry record"); });
  svg.addEventListener("pointerdown", e => {
    if(e.button !== 0) return;
    const g = e.target.closest(".nd");
    S.drag = g ? {id:g.dataset.n, x0:e.clientX, y0:e.clientY, moved:false}
               : {pan:true, x0:e.clientX, y0:e.clientY, tx0:Z.tx, ty0:Z.ty, moved:false};
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("panning");
  });
  svg.addEventListener("pointermove", e => { const dr = S.drag; if(!dr) return;
    if(Math.abs(e.clientX-dr.x0)+Math.abs(e.clientY-dr.y0) > 3) dr.moved = true;
    if(!dr.moved) return;
    if(dr.pan){ Z.tx = dr.tx0 + e.clientX - dr.x0; Z.ty = dr.ty0 + e.clientY - dr.y0; place(); return; }
    const r = svg.getBoundingClientRect(), n = idx[dr.id];
    n.x = (e.clientX - r.left - Z.tx)/Z.k; n.y = (e.clientY - r.top - Z.ty)/Z.k;
    S.pos[n.id] = {x:n.x/W, y:n.y/H};
    place(); });
  const end = () => { const dr = S.drag; S.drag = null; svg.classList.remove("panning"); if(!dr) return;
    if(!dr.pan && !dr.moved){ const ip = S.q===dr.id ? "" : dr.id; $("#q").value = ip; S.q = ip; loadView(true); } };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", () => { S.drag = null; svg.classList.remove("panning"); });
}

let inflight = false;
async function loadView(force){
  if(S.sel == null){ renderMeter(null); $("#count").textContent=""; return; }
  if(inflight && !force) return;
  inflight = true;
  const base = "/api/sessions/"+S.sel, q = encodeURIComponent(S.q);
  try{
    const sum = await api(base);
    renderMeter(sum.session);
    let html, count = "";
    if(S.tab === "flows"){
      const d = await api(base+"/flows?limit=1000&sort="+S.sort+"&q="+q);
      html = flowsTable(d); count = d.total > d.rows.length ? num(d.rows.length)+" of "+num(d.total) : num(d.total)+" rows";
      $("#exp1").href = base+"/flows.csv?sort="+S.sort+"&q="+q; $("#exp2").style.display="none";
    } else if(S.tab === "dns"){
      const d = await api(base+"/dns?limit=2000&q="+q);
      html = dnsTable(d); count = d.total > d.rows.length ? num(d.rows.length)+" of "+num(d.total) : num(d.total)+" queries";
      $("#exp1").href = base+"/dns.csv?q="+q; $("#exp2").href = base+"/dns.txt?q="+q; $("#exp2").style.display="";
    } else {
      if(S.drag) return;  // don't yank the graph out from under a drag
      S.gdata = await api(base+"/graph?limit=150&q="+q);
      if(S.posFor !== S.sel){ S.pos = {}; S.posFor = S.sel; S.zoom = {k:1,tx:0,ty:0}; }
      html = mixView(sum); $("#exp1").href = base+"/flows.csv"; $("#exp2").style.display="none";
      count = S.gdata.total_edges > S.gdata.edges.length ? "graph: top "+S.gdata.edges.length+" of "+num(S.gdata.total_edges)+" pairs" : num(S.gdata.total_edges)+" pairs";
    }
    $("#count").textContent = count;
    const v = $("#view"), y = v.parentElement.scrollTop;
    v.innerHTML = html;
    if(S.tab === "mix") drawGraph();
    v.parentElement.scrollTop = y;
  }catch(e){ if(String(e.message).includes("no such session")){ S.sel=null } else oops(e.message) }
  finally{ inflight = false }
}

async function tick(force){
  try{
    const [st, ss] = await Promise.all([api("/api/status"), api("/api/sessions")]);
    S.status = st; S.sessions = ss.sessions;
    if(S.sel == null && S.sessions.length) S.sel = S.sessions[0].id;
    renderStatus(); renderSessions();
    const selLive = S.sessions.find(s=>s.id===S.sel)?.status === "running";
    if(force || selLive || tick.wasLive) await loadView(force);
    tick.wasLive = selLive;
  }catch(e){ oops("status: "+e.message) }
}
renderDur();
tick(true);
setInterval(tick, 2000);
</script>
</body>
